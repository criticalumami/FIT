name: Test and deploy to Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "fit-pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: JS tests
        run: node --test tests/*.test.js
      - name: Python tests
        run: python3 -m unittest discover tests

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Publish an explicit allow-list only: nothing personal can leak by being committed by accident.
      - name: Build site
        run: |
          python3 generate_rr_complete_pdf.py --html-only
          mkdir -p _site
          cp index.html style.css app.js lib.js program.js .nojekyll _site/
          cp generated/rr_complete_form_guide.html _site/form-guide.html
          # Cache-bust assets and stamp the build id; open tabs compare it and reload when stale.
          V="${GITHUB_SHA::7}"
          sed -i -E \
            -e "s/(name=\"app-version\" content=)\"dev\"/\1\"$V\"/" \
            -e "s/(src|href)=\"(app|lib|program)\.js\"/\1=\"\2.js?v=$V\"/g" \
            -e "s/href=\"style\.css\"/href=\"style.css?v=$V\"/" \
            _site/index.html
          grep -q "content=\"$V\"" _site/index.html
          test "$(grep -c "?v=$V" _site/index.html)" -eq 4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
